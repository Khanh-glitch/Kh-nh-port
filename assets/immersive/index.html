<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Immersive Space Shift — ORBITA</title><style>@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap');

/* ── Fonts: only latin + vietnamese subsets are embedded ─────────────────── */
/* ── Tokens ──────────────────────────────────────────────────────────────── */
:root {
  --font-display: "Chakra Petch", "Be Vietnam Pro", ui-sans-serif, system-ui, sans-serif;
  --font-sans: "Be Vietnam Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --color-void: #02040a;
  --color-hull-950: #04070d;
  --color-hull-900: #070c16;
  --color-hull-800: #0b1424;
  --color-hull-700: #131f33;
  --color-hull-600: #22324c;

  --color-ice-50: #f2f8ff;
  --color-ice-100: #dcedff;
  --color-ice-200: #b9dcfb;
  --color-ice-300: #8dc6f2;
  --color-ice-400: #5fb0ea;

  --color-sol-100: #ffe9c6;
  --color-sol-200: #ffd595;
  --color-sol-300: #ffc470;
  --color-sol-400: #ffb048;
  --color-sol-500: #f39120;

  --color-mint-400: #56e6b9;
}

:root {
  color-scheme: dark;
  --ice: 141 198 242;
  --ice-hi: 205 232 255;
  --sol: 255 176 72;
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
}

html,
body,
#root {
  min-height: 100%;
}
body {
  margin: 0;
  background: var(--color-void);
  color: var(--color-ice-100);
  font-family: var(--font-sans);
  font-size: 1rem;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
html[data-mode="cockpit"],
html[data-mode="cockpit"] body {
  height: 100%;
  overflow: hidden;
}
h1, h2, h3, p, dl, dd, dt, ul, figure { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible {
  outline: 2px solid var(--color-sol-300);
  outline-offset: 2px;
  border-radius: 2px;
}
::selection { background: rgb(var(--sol) / 0.35); color: #fff; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── Space + glass ───────────────────────────────────────────────────────── */
.space-host {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(60% 50% at 62% 26%, rgb(40 90 140 / 0.35), transparent 70%),
    radial-gradient(50% 40% at 30% 40%, rgb(90 40 110 / 0.22), transparent 70%),
    var(--color-void);
}
.space-host canvas { display: block; width: 100%; height: 100%; }
.vignette {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(115% 95% at 50% 38%, transparent 52%, rgb(1 3 8 / 0.62) 100%);
}

/* ── Shared type helpers ─────────────────────────────────────────────────── */
.label {
  font: 500 max(0.6875rem, 9.25px)/1 var(--font-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgb(var(--ice) / 0.82);
}
.dot {
  display: inline-block;
  width: 0.45rem;
  height: 0.45rem;
  border-radius: 50%;
  background: var(--color-mint-400);
  box-shadow: 0 0 0.55rem rgb(86 230 185 / 0.9);
  animation: pulse 2.2s ease-in-out infinite;
  flex: none;
}
.avail {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font: 700 max(0.6875rem, 9.25px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-mint-400);
  white-space: nowrap;
}

/* ── Reveal ──────────────────────────────────────────────────────────────── */
[data-live="false"] .reveal { opacity: 0; }
[data-live="true"] .reveal {
  animation: holo-on 0.85s var(--ease-out) backwards;
  animation-delay: var(--d, 0ms);
}
@keyframes holo-on {
  0% { opacity: 0; clip-path: inset(49.5% 0 49.5% 0); filter: brightness(2.4); }
  30% { opacity: 1; clip-path: inset(49.5% 0 49.5% 0); filter: brightness(2.4); }
  72% { clip-path: inset(-2% -2% -2% -2%); filter: brightness(1.4); }
  100% { opacity: 1; clip-path: inset(-2% -2% -2% -2%); filter: brightness(1); }
}
@keyframes fade-up {
  from { opacity: 0; transform: translate3d(0, 0.6rem, 0); }
  to { opacity: 1; transform: none; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Hologram panel ──────────────────────────────────────────────────────── */
.holo {
  position: relative;
  border: 1px solid rgb(var(--ice) / 0.3);
  border-radius: 3px;
  background:
    linear-gradient(180deg, rgb(var(--ice) / 0.12) 0%, rgb(var(--ice) / 0.035) 24%, rgb(var(--ice) / 0.02) 100%),
    rgb(5 12 24 / 0.66);
  box-shadow:
    0 0 0 1px rgb(2 6 14 / 0.7),
    0 0 2.4rem rgb(70 150 255 / 0.16),
    inset 0 0 1.8rem rgb(90 170 255 / 0.07);
  -webkit-backdrop-filter: blur(7px) saturate(1.25);
  backdrop-filter: blur(7px) saturate(1.25);
}
.holo::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: repeating-linear-gradient(180deg, rgb(var(--ice-hi) / 0.04) 0 1px, transparent 1px 3px);
  pointer-events: none;
}
.holo::after {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  top: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgb(var(--ice-hi) / 0.95) 25%, rgb(var(--ice-hi) / 0.95) 75%, transparent);
  pointer-events: none;
}
.holo > .c {
  position: absolute;
  width: 0.6rem;
  height: 0.6rem;
  border: 0 solid rgb(var(--ice-hi) / 0.95);
  pointer-events: none;
}
.holo > .c.tl { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
.holo > .c.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
.holo > .c.bl { bottom: -1px; left: -1px; border-bottom-width: 2px; border-left-width: 2px; }
.holo > .c.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

.panel-head {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.62rem 0.85rem 0.55rem;
  border-bottom: 1px solid rgb(var(--ice) / 0.16);
}
.panel-head h2 {
  font: 700 max(0.6875rem, 9.25px)/1 var(--font-mono);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--color-ice-50);
}
.panel-head .sq {
  width: 0.4rem;
  height: 0.4rem;
  background: var(--color-sol-400);
  box-shadow: 0 0 0.5rem rgb(var(--sol) / 0.85);
  flex: none;
}
.panel-head .code {
  margin-left: auto;
  font: 500 max(0.625rem, 8.75px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  color: rgb(var(--ice) / 0.62);
}

/* ── Floating portrait screen ────────────────────────────────────────────── */
.photo-wrap {
  align-self: center;
  width: 16.5rem;
  perspective: 58rem;
}
.photo {
  position: relative;
  height: 19.4rem;
  border: 1px solid rgb(var(--ice-hi) / 0.6);
  border-radius: 3px;
  overflow: hidden;
  background: #050a14;
  box-shadow:
    0 0 0 1px rgb(2 6 14 / 0.85),
    0 0 3.2rem rgb(80 160 255 / 0.3),
    0 1.6rem 3rem -1rem rgb(0 0 0 / 0.7);
  transform-style: preserve-3d;
}
html[data-mode="cockpit"] .photo {
  transform: rotateY(14deg) rotateX(2deg);
  animation: float 7.5s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: rotateY(14deg) rotateX(2deg) translate3d(0, -0.28rem, 0); }
  50% { transform: rotateY(11.5deg) rotateX(3.2deg) translate3d(0, 0.3rem, 0); }
}
.photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 18%;
  filter: saturate(0.94) contrast(1.05) brightness(1.06);
}
.photo-tint {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgb(4 10 22 / 0.62) 0%, transparent 20%, transparent 56%, rgb(3 8 18 / 0.92) 100%),
    linear-gradient(180deg, rgb(120 190 255 / 0.1), rgb(120 190 255 / 0.04));
  pointer-events: none;
}
.photo-scan {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(180deg, rgb(var(--ice-hi) / 0.07) 0 1px, transparent 1px 3px);
  mix-blend-mode: screen;
  pointer-events: none;
}
.photo-sweep {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 34%;
  background: linear-gradient(180deg, transparent, rgb(var(--ice-hi) / 0.13) 92%, rgb(var(--ice-hi) / 0.5) 100%);
  transform: translate3d(0, -110%, 0);
  animation: sweep 6s linear infinite;
  pointer-events: none;
}
@keyframes sweep {
  0% { transform: translate3d(0, -110%, 0); }
  55%, 100% { transform: translate3d(0, 320%, 0); }
}
.photo-top {
  position: absolute;
  inset: 0.72rem 1.35rem auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font: 500 max(0.625rem, 8.75px)/1 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgb(var(--ice-hi) / 0.92);
}
.photo-top .ok { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--color-mint-400); }
.photo-top svg { width: 0.7rem; height: 0.7rem; }
.photo-cap {
  position: absolute;
  inset: auto 0.8rem 0.75rem;
}
.photo-cap strong {
  display: block;
  font: 700 1.3rem/1.3 var(--font-display);
  letter-spacing: 0.04em;
  color: var(--color-sol-300);
  text-shadow: 0 0 1rem rgb(var(--sol) / 0.5), 0 1px 2px rgb(0 0 0 / 0.8);
  white-space: nowrap;
}
.photo-cap span {
  display: block;
  margin-top: 0.2rem;
  font: 500 max(0.6875rem, 9.25px)/1.2 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--color-ice-100);
}
.photo > .c {
  position: absolute;
  width: 0.8rem;
  height: 0.8rem;
  border: 0 solid var(--color-sol-300);
  pointer-events: none;
}
.photo > .c.tl { top: 0.3rem; left: 0.3rem; border-top-width: 2px; border-left-width: 2px; }
.photo > .c.tr { top: 0.3rem; right: 0.3rem; border-top-width: 2px; border-right-width: 2px; }
.photo > .c.bl { bottom: 0.3rem; left: 0.3rem; border-bottom-width: 2px; border-left-width: 2px; }
.photo > .c.br { bottom: 0.3rem; right: 0.3rem; border-bottom-width: 2px; border-right-width: 2px; }

/* ── Quick facts ─────────────────────────────────────────────────────────── */
.facts {
  position: relative;
  display: grid;
  grid-template-columns: 5.7rem 1fr;
  row-gap: 0.2rem;
  padding: 0.6rem 0.85rem 0.7rem;
}
.facts dt {
  font: 500 max(0.6563rem, 9px)/1.3rem var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgb(var(--ice) / 0.78);
}
.facts dd {
  font-size: max(0.8125rem, 10.75px);
  line-height: 1.3rem;
  color: var(--color-ice-50);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── Overview (centre of the view) ───────────────────────────────────────── */
.brief { position: relative; text-align: center; isolation: isolate; }
.brief::before {
  content: "";
  position: absolute;
  inset: -1.6rem -3.5rem -0.8rem;
  background: radial-gradient(closest-side, rgb(2 5 12 / 0.72), rgb(2 5 12 / 0.35) 65%, transparent);
  z-index: -1;
  pointer-events: none;
}
.brief-kicker {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--color-sol-300);
}
.brief-kicker::before,
.brief-kicker::after {
  content: "";
  width: 1.6rem;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgb(var(--sol) / 0.8));
}
.brief-kicker::after { transform: scaleX(-1); }
.brief-head {
  margin-top: 0.45rem;
  font: 600 1.5rem/1.22 var(--font-display);
  letter-spacing: 0.005em;
  color: var(--color-ice-50);
  text-wrap: balance;
  text-shadow: 0 0 1.4rem rgb(2 4 10 / 0.95), 0 1px 2px rgb(2 4 10 / 0.9);
}
.brief-sum {
  margin: 0.4rem auto 0;
  max-width: 31rem;
  font-size: max(0.875rem, 11.5px);
  line-height: 1.5;
  color: rgb(214 233 251 / 0.9);
  text-wrap: pretty;
  text-shadow: 0 1px 2px rgb(2 4 10 / 0.9);
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 0.7rem;
  border-top: 1px solid rgb(var(--ice) / 0.22);
}
.stat { padding: 0.5rem 0.25rem 0; position: relative; }
.stat + .stat::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.7rem;
  bottom: 0.1rem;
  width: 1px;
  background: rgb(var(--ice) / 0.18);
}
.stat b {
  display: block;
  font: 700 1.625rem/1 var(--font-display);
  color: var(--color-sol-300);
  text-shadow: 0 0 1.1rem rgb(var(--sol) / 0.45);
  font-variant-numeric: tabular-nums;
}
.stat span {
  display: block;
  margin-top: 0.32rem;
  font: 500 max(0.5938rem, 8.5px)/1.25 var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgb(var(--ice-hi) / 0.82);
}

/* ── Experience / projects ───────────────────────────────────────────────── */
.log { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.5rem; padding: 0.62rem 0.85rem 0.68rem; }
.log li {
  position: relative;
  padding-left: 0.95rem;
}
.log li::before {
  content: "";
  position: absolute;
  left: 0.16rem;
  top: 0.95rem;
  bottom: -0.9rem;
  width: 1px;
  background: rgb(var(--ice) / 0.25);
}
.log li:last-child::before { display: none; }
.log li::after {
  content: "";
  position: absolute;
  left: 0;
  top: 0.4rem;
  width: 0.4rem;
  height: 0.4rem;
  border: 1px solid var(--color-ice-300);
  background: rgb(5 12 24);
  transform: rotate(45deg);
}
.log li:first-child::after { background: var(--color-sol-400); border-color: var(--color-sol-300); box-shadow: 0 0 0.5rem rgb(var(--sol) / 0.8); }
.row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 0.6rem; min-width: 0; }
.log h3,
.prj h3 {
  font: 600 0.9375rem/1.25 var(--font-display);
  letter-spacing: 0.01em;
  color: var(--color-ice-50);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.log time,
.metric {
  flex: none;
  font: 700 max(0.6563rem, 9px)/1 var(--font-mono);
  letter-spacing: 0.08em;
  color: var(--color-sol-300);
  white-space: nowrap;
}
.log p,
.prj p {
  margin-top: 0.14rem;
  font-size: max(0.78rem, 10.25px);
  line-height: 1.42;
  color: rgb(205 227 248 / 0.84);
}
.log p {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.log p b { font-weight: 600; color: var(--color-ice-200); }
.prj { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.42rem; padding: 0.62rem 0.85rem 0.68rem; }
.prj li + li { padding-top: 0.42rem; border-top: 1px dashed rgb(var(--ice) / 0.16); }
.prj-name { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.prj p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag {
  flex: none;
  font: 500 max(0.5938rem, 8.5px)/1 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.22rem 0.36rem;
  border-radius: 2px;
  color: var(--color-ice-200);
  box-shadow: inset 0 0 0 1px rgb(var(--ice) / 0.34);
}

/* ── Dashboard displays ──────────────────────────────────────────────────── */
.mfd {
  position: relative;
  border: 1px solid var(--color-hull-600);
  border-radius: 0.25rem;
  background: linear-gradient(180deg, #0b1525 0%, #070c16 100%);
  box-shadow:
    0 0 0 0.2rem #04070c,
    0 0 0 calc(0.2rem + 1px) rgb(var(--ice) / 0.13),
    inset 0 0 1.8rem rgb(60 130 220 / 0.13),
    inset 0 1px 0 rgb(180 220 255 / 0.09);
  overflow: hidden;
}
.mfd::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(118deg, rgb(255 255 255 / 0.05) 0%, rgb(255 255 255 / 0) 36%);
  pointer-events: none;
}
.mfd .panel-head { padding: 0.55rem 0.8rem 0.5rem; }
.stack { display: grid; gap: 0.3rem; padding: 0.55rem 0.8rem 0.6rem; }
.stack > div { display: grid; grid-template-columns: 4.4rem 1fr; align-items: center; }
.stack dt {
  font: 500 max(0.625rem, 8.75px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgb(var(--ice) / 0.78);
}
.stack dd { display: flex; flex-wrap: wrap; gap: 0.3rem; }
.chip {
  font: 500 max(0.6875rem, 9.25px)/1 var(--font-mono);
  padding: 0.3rem 0.45rem;
  border-radius: 2px;
  color: var(--color-ice-50);
  background: rgb(var(--ice) / 0.1);
  box-shadow: inset 0 0 0 1px rgb(var(--ice) / 0.16);
  white-space: nowrap;
}
.comms { position: relative; z-index: 1; display: grid; gap: 0.1rem; padding: 0.4rem 0.45rem 0.3rem; }
.comms-row {
  display: grid;
  grid-template-columns: 1rem 1fr auto;
  align-items: center;
  gap: 0.6rem;
  padding: 0.28rem 0.4rem;
  border-radius: 2px;
  font: 500 max(0.75rem, 10px)/1 var(--font-mono);
  color: var(--color-ice-50);
  text-decoration: none;
  transition: background-color 0.15s, color 0.15s;
}
.comms-row svg { width: 0.95rem; height: 0.95rem; color: var(--color-ice-300); }
.comms-row .v { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.comms-row .sr-only { grid-column: 1; }
.comms-row .go { width: 0.7rem; height: 0.7rem; opacity: 0.55; transition: opacity 0.15s, transform 0.15s; }
a.comms-row:hover { background: rgb(var(--ice) / 0.12); }
a.comms-row:hover .go { opacity: 1; transform: translate(1px, -1px); color: var(--color-sol-300); }
.copy-btn {
  font: 700 max(0.5938rem, 8.5px)/1 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.28rem 0.4rem;
  border-radius: 2px;
  color: var(--color-sol-300);
  box-shadow: inset 0 0 0 1px rgb(var(--sol) / 0.45);
  transition: background-color 0.15s;
}
.copy-btn:hover { background: rgb(var(--sol) / 0.16); }
.comms-email { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.2rem; }
.comms-foot {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin: 0.1rem 0.85rem 0;
  padding-top: 0.45rem;
  border-top: 1px solid rgb(var(--ice) / 0.14);
  font: 500 max(0.625rem, 8.75px)/1 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgb(var(--ice) / 0.8);
}

/* ── Centre console / nameplate ──────────────────────────────────────────── */
.console {
  display: flex;
  flex-direction: column;
  padding: 0.7rem 1rem 0.7rem;
  border-color: #2a3b58;
  background:
    radial-gradient(120% 90% at 50% 0%, rgb(255 176 72 / 0.07), transparent 60%),
    linear-gradient(180deg, #0c1626 0%, #070c16 100%);
}
.console-top { display: flex; align-items: center; justify-content: space-between; }
.name {
  margin-top: 0.1rem;
  padding: 0.1em 0 0.02em;
  font: 700 2.3rem/1.22 var(--font-display);
  letter-spacing: 0.045em;
  white-space: nowrap;
  color: var(--color-sol-300);
  background: linear-gradient(180deg, #fff0d4 8%, #ffc56e 52%, #f59a2c 96%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 0.75rem rgb(255 160 50 / 0.42));
}
.role {
  font: 500 max(0.6875rem, 9.25px)/1.2 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-ice-200);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.role i { font-style: normal; color: rgb(var(--ice) / 0.5); padding: 0 0.35em; }
.cta { display: grid; grid-template-columns: 1.45fr 1fr; gap: 0.6rem; margin-top: 0.6rem; }
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  height: 2.4rem;
  padding: 0 0.9rem;
  border-radius: 3px;
  font: 700 max(0.75rem, 10px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
  transition: filter 0.15s, box-shadow 0.2s, transform 0.1s, background-color 0.15s;
}
.btn svg { width: 0.85rem; height: 0.85rem; flex: none; }
.btn-primary {
  color: #1d0f00;
  background: linear-gradient(180deg, #ffdca6 0%, #ffb44e 55%, #f89a2a 100%);
  box-shadow:
    0 0 0 1px rgb(255 200 130 / 0.55),
    0 0 1.5rem rgb(255 160 50 / 0.38),
    inset 0 1px 0 rgb(255 255 255 / 0.55);
}
.btn-primary:hover { filter: brightness(1.08); box-shadow: 0 0 0 1px rgb(255 215 160 / 0.8), 0 0 2.2rem rgb(255 160 50 / 0.6), inset 0 1px 0 rgb(255 255 255 / 0.6); }
.btn-primary:active { transform: translateY(1px); filter: brightness(0.96); }
.btn-primary[aria-disabled="true"] { cursor: progress; filter: saturate(0.75) brightness(0.92); }
.btn-primary[aria-disabled="true"] .chev { animation-duration: 0.35s; }
.btn-primary .chev { animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(0.22rem); }
}
.btn-ghost {
  color: var(--color-ice-50);
  background: rgb(var(--ice) / 0.07);
  box-shadow: inset 0 0 0 1px rgb(var(--ice) / 0.4);
}
.btn-ghost:hover { background: rgb(var(--ice) / 0.16); box-shadow: inset 0 0 0 1px rgb(var(--ice-hi) / 0.75); }
.btn-ghost:active { transform: translateY(1px); }

.thr {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.6rem;
}
.thr output {
  min-width: 3.1rem;
  text-align: right;
  font: 700 max(0.75rem, 10px)/1 var(--font-mono);
  color: var(--color-sol-300);
  font-variant-numeric: tabular-nums;
}
.throttle {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 1.25rem;
  margin: 0;
  background: transparent;
  cursor: ew-resize;
  --v: 50%;
}
.throttle::-webkit-slider-runnable-track {
  height: 0.3rem;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--color-sol-400) var(--v), rgb(var(--ice) / 0.24) var(--v));
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.4);
}
.throttle::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 0.7rem;
  height: 1.15rem;
  margin-top: -0.425rem;
  border-radius: 2px;
  background: linear-gradient(180deg, #fff0d4, #ffb44e);
  box-shadow: 0 0 0.7rem rgb(var(--sol) / 0.75), 0 0 0 1px rgb(40 20 0 / 0.6);
}
.throttle::-moz-range-track { height: 0.3rem; border-radius: 2px; background: rgb(var(--ice) / 0.24); }
.throttle::-moz-range-progress { height: 0.3rem; border-radius: 2px; background: var(--color-sol-400); }
.throttle::-moz-range-thumb {
  width: 0.7rem;
  height: 1.15rem;
  border: 0;
  border-radius: 2px;
  background: linear-gradient(180deg, #fff0d4, #ffb44e);
  box-shadow: 0 0 0.7rem rgb(var(--sol) / 0.75);
}
.boost-btn {
  height: 1.5rem;
  padding: 0 0.55rem;
  border-radius: 2px;
  font: 700 max(0.625rem, 8.75px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--color-ice-100);
  box-shadow: inset 0 0 0 1px rgb(var(--ice) / 0.4);
  transition: background-color 0.12s, color 0.12s, box-shadow 0.12s;
  touch-action: none;
  user-select: none;
}
.boost-btn:hover { background: rgb(var(--ice) / 0.14); }
.boost-btn[data-on="true"] {
  color: #1d0f00;
  background: var(--color-sol-400);
  box-shadow: 0 0 1rem rgb(var(--sol) / 0.7);
}
.hints {
  margin-top: 0.45rem;
  font: 500 max(0.625rem, 8.75px)/1 var(--font-mono);
  letter-spacing: 0.1em;
  color: rgb(var(--ice) / 0.66);
  text-align: center;
}

/* ── Language toggle ─────────────────────────────────────────────────────── */
.lang {
  display: inline-flex;
  padding: 2px;
  border-radius: 3px;
  box-shadow: inset 0 0 0 1px rgb(var(--ice) / 0.35);
}
.lang button {
  min-width: 2rem;
  height: 1.4rem;
  padding: 0 0.45rem;
  border-radius: 2px;
  font: 700 max(0.6563rem, 9px)/1 var(--font-mono);
  letter-spacing: 0.12em;
  color: rgb(var(--ice-hi) / 0.8);
  transition: background-color 0.15s, color 0.15s;
}
.lang button:hover { color: #fff; }
.lang button[aria-pressed="true"] { background: var(--color-ice-200); color: #06101d; }

/* ════════════════════════════════════════════════════════════════════════════
   COCKPIT MODE
   ════════════════════════════════════════════════════════════════════════════ */
.frame {
  position: fixed;
  inset: 0;
  z-index: 3;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.stage {
  position: fixed;
  inset: 0;
  z-index: 4;
  perspective: 80rem;
  perspective-origin: 50% 38.5%;
  transition: opacity 0.4s;
}
.col {
  position: absolute;
  top: calc(6rem + var(--extra, 0rem) * 0.36);
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.col-left { left: 4.5rem; width: 21rem; }
.col-right { right: 4.5rem; width: 22.5rem; }
.plx { will-change: transform; }
.centre {
  position: absolute;
  left: 50%;
  bottom: 15.4rem;
  width: 31rem;
  margin-left: -15.5rem;
}
.dash-left,
.dash-right,
.dash-centre {
  position: absolute;
  bottom: 0.9rem;
}
.dash-left { left: 9.75rem; width: 20.75rem; height: 10.9rem; }
.dash-right { right: 9.75rem; width: 20.75rem; height: 10.9rem; }
.dash-centre { left: 50%; width: 25rem; height: 13rem; margin-left: -12.5rem; }
.dash-left > .mfd,
.dash-right > .mfd,
.dash-centre > .mfd { height: 100%; }
.gauge {
  position: absolute;
  bottom: 1.15rem;
  width: 6.7rem;
  text-align: center;
}
.gauge-left { left: 1.85rem; }
.gauge-right { right: 1.85rem; }
.gauge svg { display: block; width: 100%; height: auto; overflow: visible; }
.gauge .label { display: block; margin-top: 0.35rem; font-size: 0.5938rem; }
.gauge output {
  display: block;
  margin-top: 0.3rem;
  font: 700 max(0.75rem, 10px)/1 var(--font-mono);
  color: var(--color-sol-300);
  font-variant-numeric: tabular-nums;
}
.radar-sweep { transform-origin: 50px 50px; animation: spin 4.5s linear infinite; }

/* top HUD */
.tophud {
  position: absolute;
  inset: 0 0 auto;
  height: 2.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.75rem;
  z-index: 2;
}
.tophud-group { display: flex; align-items: center; gap: 0.9rem; }
.badge {
  font: 700 max(0.6563rem, 9px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  padding: 0.3rem 0.45rem;
  border-radius: 2px;
  color: #06101d;
  background: var(--color-ice-200);
}
.tophud-name {
  font: 700 0.9375rem/1.3 var(--font-display);
  letter-spacing: 0.08em;
  color: var(--color-sol-300);
  text-shadow: 0 0 0.8rem rgb(var(--sol) / 0.45);
  white-space: nowrap;
}
.sep { width: 1px; height: 1rem; background: rgb(var(--ice) / 0.3); }
.clock {
  font: 700 max(0.75rem, 10px)/1 var(--font-mono);
  letter-spacing: 0.08em;
  color: var(--color-ice-50);
  font-variant-numeric: tabular-nums;
}
.compass {
  position: absolute;
  left: 50%;
  top: 0.3rem;
  width: 18rem;
  height: 3.1rem;
  margin-left: -9rem;
  z-index: 2;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
  overflow: hidden;
}
.compass svg { position: absolute; left: 50%; top: 0; height: 100%; overflow: visible; will-change: transform; }
.compass-caret {
  position: absolute;
  left: 50%;
  top: 0.1rem;
  width: 0;
  height: 0;
  margin-left: -0.3rem;
  border: 0.3rem solid transparent;
  border-top-color: var(--color-sol-400);
  filter: drop-shadow(0 0 0.3rem rgb(var(--sol) / 0.9));
  z-index: 3;
}

/* canopy HUD */
.reticle {
  position: fixed;
  left: 50%;
  top: 38.5%;
  width: 11rem;
  height: 11rem;
  margin: -5.5rem 0 0 -5.5rem;
  z-index: 2;
  pointer-events: none;
  color: rgb(var(--ice-hi) / 0.8);
  filter: drop-shadow(0 0 0.35rem rgb(120 190 255 / 0.55));
}
.reticle svg { display: block; width: 100%; height: 100%; overflow: visible; }
.target {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s;
  will-change: transform;
}
.target::before,
.target::after {
  content: "";
  position: absolute;
  width: 1.1rem;
  height: 1.1rem;
  border: 0 solid var(--color-sol-300);
  filter: drop-shadow(0 0 0.3rem rgb(var(--sol) / 0.8));
}
.target::before { left: 0; top: 0; border-left-width: 1.5px; border-top-width: 1.5px; }
.target::after { right: 0; bottom: 0; border-right-width: 1.5px; border-bottom-width: 1.5px; }
.target-label {
  position: absolute;
  right: 0;
  top: 100%;
  margin-top: 0.5rem;
  text-align: right;
  white-space: nowrap;
  text-shadow: 0 1px 2px rgb(2 4 10 / 0.95), 0 0 0.8rem rgb(2 4 10 / 0.9);
}
.target-label .label { display: block; color: var(--color-sol-300); font-size: 0.625rem; }
.target-label strong {
  display: block;
  margin-top: 0.3rem;
  font: 700 0.8125rem/1.1 var(--font-display);
  letter-spacing: 0.08em;
  color: var(--color-ice-50);
}
.target-label em {
  display: block;
  margin-top: 0.28rem;
  font: 500 max(0.6563rem, 9px)/1 var(--font-mono);
  font-style: normal;
  letter-spacing: 0.08em;
  color: rgb(var(--ice-hi) / 0.88);
  font-variant-numeric: tabular-nums;
}
[data-jump="charging"] .target::before,
[data-jump="charging"] .target::after { animation: pulse 0.3s linear infinite; }
[data-jump="charging"] .stage .plx { opacity: 0.55; transition: opacity 0.6s; }

/* ── Jump: notice + flash ────────────────────────────────────────────────── */
.notice {
  position: fixed;
  left: 50%;
  top: 5.2rem;
  z-index: 30;
  width: min(30rem, calc(100vw - 2rem));
  transform: translateX(-50%);
  padding: 0.9rem 1rem 0.95rem;
  border-color: rgb(var(--sol) / 0.6);
  box-shadow: 0 0 0 1px rgb(2 6 14 / 0.7), 0 0 2.6rem rgb(var(--sol) / 0.25);
  animation: fade-in 0.35s var(--ease-out) both;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
[data-live="false"] .target,
[data-live="false"] .reticle { opacity: 0 !important; }
.reticle { transition: opacity 0.8s 0.5s; }
.notice h2 {
  font: 700 0.9375rem/1.3 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--color-sol-300);
}
.notice p { margin-top: 0.3rem; font-size: 0.8125rem; line-height: 1.5; color: var(--color-ice-100); }
.notice code { font-family: var(--font-mono); font-size: 0.92em; color: var(--color-sol-200); }
.notice button {
  position: relative;
  margin-top: 0.6rem;
  font: 700 max(0.6563rem, 9px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.4rem 0.6rem;
  border-radius: 2px;
  color: var(--color-ice-50);
  box-shadow: inset 0 0 0 1px rgb(var(--ice) / 0.45);
}
.notice button:hover { background: rgb(var(--ice) / 0.14); }
.flash {
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(circle at 50% 38.5%, #fff 0%, #dcefff 28%, #86bcff 75%, #3f7fd8 100%);
  transition: opacity 1.1s ease-out;
}
[data-jump="flash"] .flash { opacity: 1; transition: opacity 0.4s ease-in; }

/* ── Boot overlay ────────────────────────────────────────────────────────── */
.boot {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: var(--color-void);
  transition: opacity 0.7s ease, visibility 0s linear 0.7s;
}
.boot[data-leaving="true"] { opacity: 0; visibility: hidden; pointer-events: none; }
.boot-box { width: min(24rem, calc(100vw - 3rem)); }
.boot-box .label { color: var(--color-sol-300); }
.boot-name {
  margin-top: 0.6rem;
  font: 700 1.75rem/1.3 var(--font-display);
  letter-spacing: 0.06em;
  color: var(--color-ice-50);
}
.boot-lines { margin-top: 1rem; display: grid; gap: 0.5rem; min-height: 4.2rem; }
.boot-lines li {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  font: 500 max(0.75rem, 10px)/1 var(--font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgb(var(--ice-hi) / 0.85);
  animation: fade-up 0.25s var(--ease-out) both;
}
.boot-lines li b { color: var(--color-mint-400); font-weight: 700; }
.boot-bar { margin-top: 1rem; height: 2px; background: rgb(var(--ice) / 0.2); overflow: hidden; }
.boot-bar i {
  display: block;
  height: 100%;
  background: var(--color-sol-400);
  box-shadow: 0 0 0.6rem rgb(var(--sol) / 0.9);
  transform-origin: 0 50%;
  animation: boot-fill 1.5s cubic-bezier(0.5, 0, 0.2, 1) both;
}
@keyframes boot-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.boot-skip {
  margin-top: 1.2rem;
  font: 500 max(0.6563rem, 9px)/1 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgb(var(--ice) / 0.7);
  padding: 0.4rem 0;
}
.boot-skip:hover { color: var(--color-ice-50); }

/* ════════════════════════════════════════════════════════════════════════════
   COMPACT MODE (phones, tablets, portrait, heavy zoom)
   ════════════════════════════════════════════════════════════════════════════ */
.compact { position: relative; z-index: 4; min-height: 100dvh; }
.c-top {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.6rem max(1rem, env(safe-area-inset-right)) 0.6rem max(1rem, env(safe-area-inset-left));
  background: linear-gradient(180deg, #0b1424 0%, #070c16 100%);
  border-bottom: 1px solid rgb(var(--ice) / 0.28);
  box-shadow: 0 0.6rem 1.4rem rgb(0 0 0 / 0.5);
}
.c-top .tophud-group { gap: 0.6rem; min-width: 0; }
.c-top .tophud-name { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; }
.c-main {
  display: grid;
  gap: 0.9rem;
  width: min(100%, 44rem);
  margin: 0 auto;
  padding: 1.25rem 1rem 9.5rem;
}
.compact .photo-wrap { width: min(100%, 18rem); margin: 0.25rem auto 0.5rem; }
.compact .photo { height: auto; aspect-ratio: 5 / 6; animation: bob 7s ease-in-out infinite; }
@keyframes bob {
  0%, 100% { transform: translate3d(0, -0.2rem, 0); }
  50% { transform: translate3d(0, 0.3rem, 0); }
}
.compact .brief {
  padding: 1.1rem 1rem 1rem;
  border: 1px solid rgb(var(--ice) / 0.3);
  border-radius: 3px;
  background: rgb(5 12 24 / 0.7);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
}
.compact .brief::before { display: none; }
.compact .brief-head { font-size: 1.45rem; }
.compact .brief-sum { font-size: 0.9375rem; }
.compact .stats { grid-template-columns: repeat(2, 1fr); row-gap: 0.6rem; }
.compact .stat:nth-child(3)::before { display: none; }
.compact .stat span { font-size: 0.6875rem; }
.compact .facts dd,
.compact .log h3,
.compact .prj h3,
.compact .prj p { white-space: normal; }
.compact .facts dd { font-size: 0.9375rem; line-height: 1.45; }
.compact .facts dt { line-height: 1.45rem; }
.compact .log p,
.compact .prj p { font-size: 0.875rem; -webkit-line-clamp: unset; line-clamp: unset; }
.compact .log h3,
.compact .prj h3 { font-size: 1rem; }
.compact .chip { font-size: 0.75rem; padding: 0.38rem 0.5rem; }
.compact .comms-row { font-size: 0.8125rem; padding: 0.7rem 0.4rem; }
.compact .copy-btn { padding: 0.55rem 0.6rem; }
.compact .comms-foot { margin-bottom: 0.8rem; }
.compact .stack > div { grid-template-columns: 4.6rem 1fr; }
.c-console {
  position: fixed;
  inset: auto 0 0;
  z-index: 10;
  padding: 0.7rem max(1rem, env(safe-area-inset-right)) calc(0.8rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
  background: linear-gradient(180deg, #0c1626 0%, #05080f 100%);
  border-top: 1px solid rgb(var(--ice) / 0.35);
  box-shadow: 0 -0.8rem 2rem rgb(0 0 0 / 0.6);
}
.c-console-inner { width: min(100%, 42rem); margin: 0 auto; }
.c-console .name { font-size: clamp(1.5rem, 7.2vw, 2.1rem); margin: 0; }
.c-console .cta { margin-top: 0.45rem; }
.c-console .btn { height: 2.9rem; }
@media (min-width: 720px) {
  .c-main { grid-template-columns: 1fr 1fr; width: min(100%, 60rem); align-items: start; }
  .c-main > .span-2 { grid-column: 1 / -1; }
  .c-main > .o-stack { order: 1; }
  .c-main > .o-exp,
  .c-main > .o-prj { order: 2; }
  .c-main > .o-comms { order: 3; }
}

/* ── Reduced motion ──────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  [data-live="true"] .reveal,
  .photo,
  html[data-mode="cockpit"] .photo,
  .compact .photo,
  .photo-sweep,
  .dot,
  .radar-sweep,
  .btn-primary .chev,
  .boot-bar i,
  .boot-lines li,
  .notice {
    animation: none !important;
  }
  .photo-sweep { display: none; }
  .boot, .flash, [data-jump="flash"] .flash { transition-duration: 0.01s; }
}

/* Immersive space-entry energy gate: charge is tied to real ORBITA readiness. */
.energy-gate{position:relative;display:inline-flex;isolation:isolate;padding:6px;border-radius:999px;filter:drop-shadow(0 0 10px rgba(86,206,255,.25));}
.energy-ring{position:absolute;inset:0;border-radius:999px;padding:2px;background:conic-gradient(from -80deg,#57e3ff var(--charge),rgba(90,160,245,.12) var(--charge));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;box-shadow:0 0 22px rgba(26,190,255,.3);}
.energy-particles{position:absolute;inset:-11px;border-radius:999px;pointer-events:none;overflow:hidden;background:repeating-conic-gradient(from 0deg,transparent 0deg 23deg,rgba(120,237,255,.45) 25deg,transparent 28deg 54deg);mask:radial-gradient(ellipse farthest-side, transparent 83%,black 88%,transparent 99%);animation:spaceBeamSpin 4s linear infinite;}
.energy-gate[data-ready="true"]{filter:drop-shadow(0 0 23px rgba(89,220,255,.7));}
.energy-gate[data-ready="true"] .energy-particles{animation-duration:1.2s;filter:brightness(1.9);}
.energy-gate[data-warp="true"] .energy-ring{animation:spaceBeamPulse .2s ease-in-out infinite alternate;}
.energy-gate .btn[disabled]{cursor:progress;opacity:.78;pointer-events:none;}
@keyframes spaceBeamSpin{to{transform:rotate(360deg);}}
