name: HEX distance-safe Cinema light readback A/B with full visuals
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-cinema-far-light-ab.yml', 'source/src/scene/Cinema.tsx', 'scripts/hex-cpu-first-trigger-trace.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-first
            modes: 'normal,cinema-far-light'
          - label: candidate-first
            modes: 'cinema-far-light,normal'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build unchanged full-quality UEH, cinema and HEX
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs && node tests/hex-preservation.mjs)
      - name: Check source-screen readback CPU and exact cold HEX rAF gaps
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-cinema-far-light.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-cinema-distance-safe-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
