name: Colossus renderer fingerprint and paired cold-laser tests
on:
  push:
    branches:
      - qa/colossus-renderer-backend-matrix
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        backend: [swiftshader, angle-gl, egl]
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Measure first trigger and log true GL renderer
        env:
          COL_BACKEND: ${{ matrix.backend }}
          COL_VARIANT: ${{ matrix.variant }}
        run: node scripts/colossus-backend-matrix.mjs
      - name: Preserve profile for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.backend }}-${{ matrix.variant }}
          path: browser-evidence/
          if-no-files-found: warn
