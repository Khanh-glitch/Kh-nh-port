name: HEX first-draw GPU isolate real groups
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-gpu-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production standalone with isolated test-only groups
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Isolate eight original UEH instanced meshes by building, foliage and wind groups
        env:
          HEX_GPU_MODES: 'normal,no-ueh-architecture,no-ueh-foliage,no-ueh-wind,no-ueh-instanced'
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-diagnostic.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-gpu-isolation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-first-gpu-draw-cause-ablation
          path: hex-gpu-isolation/
          if-no-files-found: warn
