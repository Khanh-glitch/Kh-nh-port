name: HEX GPU frame-starvation category bisection — no release visual changes
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-gpu-starvation-bisect.yml','scripts/hex-cpu-first-trigger-trace.mjs','scripts/sync-hex-standalone.mjs','source/src/reality/RealityHost.tsx','source/src/scene/Cinema.tsx']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-first
            modes: 'prime-cinema-far,gpu-no-instances,gpu-no-world'
          - label: ablation-first
            modes: 'gpu-no-world,gpu-no-instances,prime-cinema-far'
          - label: foliage-first
            modes: 'gpu-no-foliage,gpu-no-architecture,gpu-no-wind'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact source and published HTML with full original quality
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs && node tests/hex-preservation.mjs)
      - name: Diagnose rAF versus timer heartbeat while isolating UEH draw families
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-gpu-starve-bisect.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-gpu-bisect-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
