name: Import converted portfolio media
on:
  push:
    branches: [arena/1e2ad83c-kh-nh-port]
    paths: [.github/workflows/portfolio-media-import.yml]
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1e2ad83c-kh-nh-port
      - uses: actions/download-artifact@v4
        with:
          name: converted-portfolio-videos
          path: source/public/portfolio/films
          github-token: ${{ github.token }}
          run-id: 43455663970
      - name: Verify videos and commit to this working branch
        run: |
          set -euxo pipefail
          for f in mua-ha social-1 social-2 social-3; do test -s "source/public/portfolio/films/$f.mp4"; done
          du -h source/public/portfolio/films/{mua-ha,social-1,social-2,social-3}.mp4
          git config user.name 'Portfolio Media Import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/public/portfolio/films/{mua-ha,social-1,social-2,social-3}.mp4
          git commit -m 'Add web-ready original portfolio videos'
          git push origin HEAD:arena/1e2ad83c-kh-nh-port
