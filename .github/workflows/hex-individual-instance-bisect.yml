name: HEX individual instanced mesh GPU bisection with untouched production visuals
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-individual-instance-bisect.yml','scripts/hex-cpu-first-trigger-trace.mjs','source/src/reality/RealityHost.tsx','scripts/sync-hex-standalone.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: foliage-green
            modes: 'prime-cinema-far,gpu-no-instance-3,gpu-no-instance-4'
          - label: foliage-flower-grass
            modes: 'gpu-no-instance-5,gpu-no-instance-3,prime-cinema-far'
          - label: architecture
            modes: 'gpu-no-instance-0,gpu-no-instance-1,gpu-no-instance-2'
          - label: wind
            modes: 'gpu-no-instance-6,gpu-no-instance-7,prime-cinema-far'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build full PBR source and actual published HTML
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs && node tests/hex-preservation.mjs)
      - name: Measure single-mesh ablations versus fully visible HEX
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-individual-instance.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-single-instance-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
