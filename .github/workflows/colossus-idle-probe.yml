name: Colossus prewarm causal idle A-B
on:
  push:
    branches:
      - fix/colossus-frame-budget-prewarm
  workflow_dispatch:
permissions:
  contents: read
jobs:
  idle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
        prewarm: [enabled, disabled]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Synchronize exact candidate HTML
        run: |
          node scripts/sync-colossus-standalone.mjs
          node scripts/build-pages.mjs
      - name: Measure idle Colossus scene with no click
        env:
          COLOSSUS_SMOKE_URL: http://127.0.0.1:4173/#at=0,-27,0,20&autostart&skip
          COLOSSUS_AB_VARIANT: ${{ matrix.prewarm }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/colossus-idle.log 2>&1 &
          for n in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/colossus-idle-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossus-idle-${{ matrix.prewarm }}-${{ matrix.trial }}
          path: browser-evidence/
          if-no-files-found: warn
