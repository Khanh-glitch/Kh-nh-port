name: Portfolio HEX original-material draw warm experiment
on:
  push:
    branches: [arena/1e2ad83c-kh-nh-port]
    paths: ['.github/workflows/portfolio-hex-real-draw-warm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-metal-full-lifecycle:
    runs-on: macos-15
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        order: [forward, reverse]
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 4454511b31913531856549659bf55628ffc25578
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build authentic published HTML, original unchanged high-quality 3D
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-portfolio-standalone.mjs && node scripts/build-pages.mjs && node tests/hex-preservation.mjs)
          (cd baseline && node scripts/build-pages.mjs)
      - name: Capture authentic visitor first, switch, retract and second HEX with rAF silent tails
        env:
          HEX_AB_ORDER: ${{ matrix.order }}
          HEX_DRAW_WARM: "1"
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-gate-baseline.log 2>&1 &
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-gate-candidate.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/ && curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          python3 -c "from pathlib import Path; p=Path('candidate/scripts/hex-hitch-a-b.mjs'); s=p.read_text(); s=s.replace('?hexProfile=1','?hexProfile=1&hexActualDrawWarm=1'); p.write_text(s)"
          node candidate/scripts/hex-hitch-a-b.mjs
      - name: Reject remaining freezes and misleading CI green
        if: always()
        run: |
          if test -f hex-evidence/bench.json; then
            node candidate/scripts/hex-no-hitch-release-gate.mjs
          else
            echo "HEX_RELEASE_REJECTED: no actual benchmark evidence"
            exit 1
          fi
      - name: Publish measurements in job annotations
        if: always()
        run: |
          if test -f hex-evidence/bench.json; then
            python3 -c "import json; print('::notice title=HEX measured benchmark::'+json.dumps([{'name':r['name'],'samples':[{k:s.get(k) for k in ['name','maxObservedGapMs','p95Ms','maxLongTaskMs','frames']} for s in r.get('samples',[])],'warm':r.get('actualDrawWarm'),'error':r.get('error'),'errors':r.get('errors',[]),'failures':r.get('failures',[])[:1]} for r in json.load(open('hex-evidence/bench.json'))],separators=(',',':')))"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-actual-draw-warm-${{ matrix.order }}
          path: hex-evidence/
          if-no-files-found: warn
