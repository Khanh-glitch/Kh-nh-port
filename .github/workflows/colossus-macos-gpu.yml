name: Colossus Apple Silicon real-GPU probe
on:
  push:
    branches:
      - fix/colossus-frame-budget-prewarm
    paths:
      - 'scripts/colossus-browser-smoke.mjs'
      - '.github/workflows/colossus-macos-gpu.yml'
      - 'source/src/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
        prewarm: [enabled, disabled]
        shadowWarm: [small, full]
        exclude:
          - prewarm: disabled
            shadowWarm: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Install Playwright Chromium matching the runner architecture
        run: cd source && npx playwright install chromium
      - name: Build actual candidate HTML
        run: |
          node scripts/sync-colossus-standalone.mjs
          node scripts/build-pages.mjs
      - name: Verify and measure actual Metal GPU, never silently accept SwiftShader
        env:
          COLOSSUS_SMOKE_URL: http://127.0.0.1:4173/#at=0,-27,0,20&autostart&skip
          COLOSSUS_GPU_MODE: metal
          COLOSSUS_AB_VARIANT: ${{ matrix.prewarm }}
          COLOSSUS_SHADOW_VARIANT: normal
          COLOSSUS_SHADOW_WARM: ${{ matrix.shadowWarm }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/colossus-macos.log 2>&1 &
          for n in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/colossus-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossus-metal-trial-${{ matrix.prewarm }}-${{ matrix.shadowWarm }}-${{ matrix.trial }}
          path: browser-evidence/
          if-no-files-found: warn
