name: HEX WebGL GPU driver call profile cold full UEH
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-webgl-call-profile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  call-profile:
    runs-on: macos-15
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: full-first
            modes: 'normal,no-ueh-instanced,basic-instances'
          - label: no-instances-first
            modes: 'no-ueh-instanced,basic-instances,normal'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source-matched original-quality HEX
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Profile native WebGL2 submission timing with source shaders fully warmed
        env:
          HEX_GL_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-webgl-profile.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-webgl-call-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-webgl-cold-driver-${{ matrix.label }}
          path: hex-gl-profile/
          if-no-files-found: warn
