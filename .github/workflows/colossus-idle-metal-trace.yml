name: Colossus cold-first-click Metal trace, full visuals
on:
  pull_request:
    branches: [main]
    paths:
      - 'source/src/scene/ShowcaseWarmup.tsx'
      - 'scripts/sync-colossus-idle-standalone.mjs'
      - '.github/workflows/colossus-idle-metal-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-webgl-trace:
    runs-on: macos-15
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install chromium
      - name: Publish exact scheduler-only standalone and validate visual module integrity
        run: |
          node scripts/sync-colossus-idle-standalone.mjs
          node tests/integration-regression.mjs
          node --test tests/colossus-idle-retry-contract.mjs
          node scripts/build-pages.mjs
      - name: Trace real WebGL first laser on paravirtual Metal (not physical GPU acceptance)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/colossus-idle-metal.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/colossus-gpu-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossus-resumable-idle-metal-evidence
          path: browser-evidence/
          if-no-files-found: warn
