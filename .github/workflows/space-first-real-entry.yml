name: Ship first, actual 3D readiness, no map flash or fake progress
on:
  push:
    branches:
      - fix/space-first-real-readiness-entry-20261112
      - feat/portfolio-source-truth-20261112
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  original-visual-and-entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Source/standalone embedded map inventory for portfolio PR
        run: node scripts/portfolio-module-inventory.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install actual island and ship compilers
        run: |
          npm ci --prefix source
          npm ci --prefix source/immersive
          npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Original 3D source compiles with no API/visual downgrades
        run: |
          node scripts/check-space-entry-types.mjs
          npx --prefix source/immersive tsc --noEmit --project source/immersive/tsconfig.entry.json
      - name: Publish ONLY reviewed entry source to actual integrated and ship HTML
        run: |
          node --check scripts/sync-space-first-standalone.mjs
          node scripts/sync-space-first-standalone.mjs
          node scripts/sync-portfolio-standalone.mjs
          node --test tests/portfolio-source-acceptance.mjs
          node --test tests/space-first-entry-contract.mjs
          node --test tests/exhibit-click-path.mjs
          node tests/integration-regression.mjs
          node scripts/build-pages.mjs
          cmp -s index.html dist-pages/index.html
          cmp -s assets/immersive/index.html dist-pages/assets/immersive/index.html
      - name: Publishing is byte-idempotent (the served HTML is never stale)
        run: |
          set -eu
          # Re-running the same publish step must not change a single byte. A
          # previous revision re-appended the profile header on every run, and
          # older CSS edits were skipped because the <style> id already existed,
          # so committed standalone files silently drifted from source truth.
          cp index.html /tmp/index.publish-1.html
          cp assets/immersive/index.html /tmp/ship.publish-1.html
          node scripts/sync-space-first-standalone.mjs
          node scripts/sync-portfolio-standalone.mjs
          node scripts/build-pages.mjs
          cmp -s index.html /tmp/index.publish-1.html
          cmp -s assets/immersive/index.html /tmp/ship.publish-1.html
          echo "PUBLISH_IDEMPOTENT_OK"
      - name: The committed standalone files equal a fresh build of this HEAD
        run: |
          set -eu
          # index.html / assets/immersive/index.html are committed artifacts.
          # If they differ from a fresh publish of this exact source HEAD, then
          # the file recruiters load is not what this commit says it is.
          git diff --exit-code -- index.html assets/immersive/index.html \
            tests/integration-original-modules.json || {
              echo "STALE_PUBLISHED_HTML: run scripts/sync-space-first-standalone.mjs + scripts/sync-portfolio-standalone.mjs and commit the result";
              exit 1;
            }
      - name: Install Playwright GPU browser
        run: cd source && npx playwright install --with-deps chromium
      - name: Actual cold Galaxy before island, 2 live renderers, real transition
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/space-first.log 2>&1 &
          for n in {1..90}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/space-first-browser-test.mjs
      - name: Mobile recovery if spacecraft WebGL/HTML request initially fails
        run: node scripts/space-first-recovery-browser-test.mjs
      # Real dossier interaction on SwiftShader, INCLUDING opening exhibits by
      # walking up to them and clicking them in the 3D world. This gate is not
      # optional: a software GPU is slow, not exempt, and the earlier failure
      # (workflow run 43184448178) was a real interaction defect, not a GPU
      # artefact. Diagnostics are printed inline so no upload is required.
      - name: Real exhibit/dossier interaction in 3 viewports (SwiftShader)
        env:
          # Real walking needs a renderer that can sustain movement frames; this
          # runner measures about one frame per 30s on the full island scene, so
          # walking is proven on Apple Metal and the same click path is proven
          # here from a real standing pose. Neither is skipped or faked.
          PORTFOLIO_ENTRY: dom
        run: |
          set -eu
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/portfolio-dossier-swiftshader.log 2>&1 &
          for n in {1..90}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/portfolio-panel-browser-test.mjs
      - name: Dossier interaction evidence (survives a failed upload)
        if: always()
        run: |
          echo '--- dossier report ---'
          cat browser-evidence/portfolio/report.txt 2>/dev/null || echo 'NO_REPORT'
      - name: Summary of real input paths
        if: always()
        run: |
          test -f browser-evidence/portfolio/report.json
          node -e "
            const r=require('./browser-evidence/portfolio/report.json');
            console.log('backend', r.backend, 'viewports', r.viewports.join(','));
            console.log('world entries', r.worldEntry.length, JSON.stringify(r.worldEntry));
            console.log('panel audits', r.panels.length);
            console.log('input paths', JSON.stringify(r.inputPaths));
            console.log('failures', r.failures.length);
            if (r.failures.length) { for (const f of r.failures) console.log(JSON.stringify(f)); process.exit(1) }
          "
      # CI must never rewrite the reviewed artifacts. It previously pushed a
      # bot commit that republished HTML from an older revision, which is how
      # the served index.html drifted away from source truth. The gate above
      # fails instead, and a human commits the regenerated files.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: portfolio-reviewed-standalone-preview
          path: dist-pages/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-first-no-visual-loss-screenshots-and-gate
          path: |
            browser-evidence/entry/
            browser-evidence/entry-recovery/
            browser-evidence/portfolio/
          if-no-files-found: warn
