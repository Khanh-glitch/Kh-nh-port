name: HEX native instance-attribute GPU-first-use prewarm A/B no visual loss
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-instance-buffer-warm-ab.yml','source/src/reality/RealityHost.tsx','scripts/hex-cpu-first-trigger-trace.mjs','scripts/sync-hex-standalone.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: control-first
            modes: 'prime-cinema-far,gpu-attribute-warm'
          - label: buffer-first
            modes: 'gpu-attribute-warm,prime-cinema-far'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile exact original 3D source and embed into real published HTML
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs && node tests/hex-preservation.mjs)
      - name: Compare real first HEX rAF and CPU timer plus idle GPU warm budget
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-instance-buffer-ab.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-gpu-instance-original-buffers-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
