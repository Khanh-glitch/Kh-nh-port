name: HX-9 native cinematic validation
on:
  push:
    branches: [arena/1e2ad83c-kh-nh-port]
    paths: ['.github/workflows/portfolio-hx9-cinematic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-browser:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix source && npm install --prefix source --no-save --package-lock=false playwright@1.56.1 && (cd source && npx playwright install chromium)
      - run: node scripts/build-pages.mjs
      - name: Exercise cinematic, real gate and entry
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/hx9-server.log 2>&1 &
          node scripts/hx9-cinematic-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx9-cinematic-native
          path: hx9-evidence/
          if-no-files-found: warn
