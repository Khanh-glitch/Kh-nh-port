name: Colossus lossless Reality draw-gate A/B
on:
  push:
    branches:
      - fix/colossus-reality-idle-draw-gate
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        kind: [idle, laser]
        variant: [baseline, gated]
        trial: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Same complete graphics profile, isolated gating change only
        env:
          COL_VARIANT: ${{ matrix.variant }}
        run: |
          if [ "${{ matrix.kind }}" = idle ]; then
            node scripts/colossus-gate-benchmark.mjs
          else
            node scripts/colossus-gate-first-laser.mjs
          fi
      - name: Preserve laser evidence without forcing user to run tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colossus-gate-${{ matrix.kind }}-${{ matrix.variant }}-${{ matrix.trial }}
          path: browser-evidence/
          if-no-files-found: ignore
