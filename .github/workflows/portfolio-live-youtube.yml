name: Portfolio live YouTube playback diagnostic
on:
  push:
    branches: [arena/1e2ad83c-kh-nh-port]
    paths: ['.github/workflows/portfolio-live-youtube.yml', 'scripts/hex-live-youtube-check.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix source
          npm install --prefix source --no-save --package-lock=false playwright@1.56.1
          (cd source && npx playwright install --with-deps chromium)
          npm run build --prefix source
          node scripts/sync-portfolio-standalone.mjs
          node scripts/build-pages.mjs
      - name: Real YouTube iframe, no stub or autoplay override
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/hex-http.log 2>&1 &
          node scripts/hex-live-youtube-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-live-evidence
          path: youtube-evidence/
          if-no-files-found: warn
