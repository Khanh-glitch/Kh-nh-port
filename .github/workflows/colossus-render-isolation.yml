name: Colossus render-layer causal isolation
on:
  push:
    branches:
      - experiment/colossus-render-layer-isolation
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-layer-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        layer: [full, no-post, no-reality, no-phenomena]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Measure identical Robot camera with only one layer toggled
        env:
          LAYER_FLAG: ${{ matrix.layer }}
        run: node scripts/colossus-layer-isolation.mjs
