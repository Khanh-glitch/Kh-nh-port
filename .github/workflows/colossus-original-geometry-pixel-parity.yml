name: Colossus six-stage exact image parity, no visual loss
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-pixel-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install --with-deps chromium
      - name: Verify actual standalone contains both exact approved source modules
        run: |
          node scripts/sync-colossus-idle-standalone.mjs
          node tests/integration-regression.mjs
          node --test tests/colossus-idle-retry-contract.mjs
          node scripts/build-pages.mjs
      - name: Strict same-frame original geometry GPU 6-stage image parity
        env:
          COLOSSUS_PARITY_BACKEND: software
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/colossus-pixel.log 2>&1 &
          for n in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/colossus-original-geometry-pixel-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossus-six-stage-software-pixel-parity
          path: browser-evidence/
          if-no-files-found: warn
