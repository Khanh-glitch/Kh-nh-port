name: Colossus Metal GPU/compositor trace
on:
  push:
    branches: [fix/colossus-frame-budget-prewarm]
    paths:
      - 'scripts/colossus-gpu-trace.mjs'
      - '.github/workflows/colossus-gpu-trace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install chromium
      - run: |
          node scripts/sync-colossus-standalone.mjs
          node scripts/build-pages.mjs
      - name: Trace Metal compositor and GPU during first laser
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/colossus-trace.log 2>&1 &
          for n in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/colossus-gpu-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossus-metal-gpu-trace
          path: browser-evidence/
          if-no-files-found: warn
