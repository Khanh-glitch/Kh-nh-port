name: First-visit hitch experiment checks
on:
  push:
    branches:
      - experiment/first-visit-hitch-piano-colossus
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone ESM syntax and quality contracts
        run: node tests/first-visit-hitch.mjs
      - name: Install source dependencies
        run: npm ci --prefix source
      - name: Build Vite source for type/transpile issues
        run: npm run build --prefix source
