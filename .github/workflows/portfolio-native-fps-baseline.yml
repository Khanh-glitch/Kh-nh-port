name: Native Metal baseline FPS 5 island viewpoints without visual downgrade
on:
  pull_request:
    branches: [main]
  push:
    branches: [perf/portfolio-native-fps-baseline-20261112]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-fps:
    runs-on: macos-15
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm ci --prefix source/immersive
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install chromium
      - name: Preserve main-stage, cockpit, all actual island modules exactly
        run: |
          node scripts/check-space-entry-types.mjs
          node scripts/sync-portfolio-standalone.mjs
          node --test tests/portfolio-source-acceptance.mjs
          node tests/integration-regression.mjs
          node scripts/build-pages.mjs
          cmp -s index.html dist-pages/index.html
          cmp -s assets/immersive/index.html dist-pages/assets/immersive/index.html
      - name: Actual 5-scene Metal measured rAF, long tasks, idle, no click
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/portfolio-native-fps.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/portfolio-native-fps-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5-viewpoint-native-Metal-FPS-evidence
          path: browser-evidence/native-fps/
          if-no-files-found: warn
