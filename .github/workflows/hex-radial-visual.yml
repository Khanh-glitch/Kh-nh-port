name: HEX radial opt-in exact-scene visual parity
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-radial-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source-matched original visual quality
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Capture nine original-v-radial scan front stages, retract and repeat
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-radial-visual.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-radial-visual.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-radial-scanned-original-pixel-comparison
          path: hex-radial-frames/
          if-no-files-found: warn
