name: HEX original-leaf vertex-gate native Metal reversed-order A/B
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-vertex-gate-metal-ab.yml','source/src/reality/foliage.tsx','source/src/reality/mask.ts','scripts/hex-cpu-first-trigger-trace.mjs','scripts/sync-hex-standalone.mjs','tests/hex-preservation.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-metal:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-first
            modes: 'prime-cinema-far,gpu-vertex-leaves,gpu-vertex-all'
          - label: leaves-first
            modes: 'gpu-vertex-leaves,prime-cinema-far,gpu-vertex-all'
          - label: all-first
            modes: 'gpu-vertex-all,gpu-vertex-leaves,prime-cinema-far'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact published portfolio including unmodified instance matrices and colors
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs && node tests/hex-preservation.mjs)
      - name: Measure authentic first HEX rAF, JS heartbeat, long-task, and GPU-clip manifest
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-vertex-gate.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-vertex-gate-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
