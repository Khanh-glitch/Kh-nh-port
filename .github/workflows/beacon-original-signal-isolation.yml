name: Beacon original-signal GPU cause isolation (diagnostic only)
on:
  push:
    branches: [fix/beacon-real-light-cold-trigger-20261112]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-event-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install --with-deps chromium
      - name: Require exact original published module hashes
        run: |
          node scripts/sync-hex-beacon-standalone.mjs
          node --test tests/beacon-standalone-contract.mjs
          node tests/integration-regression.mjs
          node scripts/build-pages.mjs
      - name: Full original vs panel isolation vs social isolation
        env:
          BEACON_AB_MODES: baseline,no-panel,no-social,no-panel-no-social
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/beacon-isolate.log 2>&1 &
          for n in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/beacon-first-trigger-ab.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beacon-first-trigger-original-panel-social-bisect
          path: browser-evidence/
          if-no-files-found: warn
