name: HEX standalone source parity + build (branch only)
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['source/src/reality/RealityHost.tsx','source/src/reality/Front.tsx','scripts/sync-hex-standalone.mjs','tests/hex-preservation.mjs','.github/workflows/hex-sync-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hex-sync-source
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hex-hitch-no-visual-loss
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix source
      - name: Compile unchanged full quality Vite scene
        run: npm run build --prefix source
      - name: Synchronize the REAL published ORBITA standalone
        run: |
          node scripts/sync-hex-standalone.mjs
          node scripts/build-pages.mjs
          node tests/hex-preservation.mjs
          git diff --check
      - name: Commit synchronized standalone to HEX candidate branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A performance branch may advance while this workflow builds.
          # Always regenerate the standalone from the LATEST source before push.
          for attempt in 1 2 3; do
            git fetch origin fix/hex-hitch-no-visual-loss
            git reset --hard origin/fix/hex-hitch-no-visual-loss
            node scripts/sync-hex-standalone.mjs
            node tests/hex-preservation.mjs
            git diff --check
            if git diff --quiet -- index.html; then
              echo "Standalone HTML matches latest source"
              exit 0
            fi
            git add index.html
            git commit -m "build(hex): publish source-matched Reality Rewrite GPU prewarm in standalone"
            if git push origin HEAD:fix/hex-hitch-no-visual-loss; then exit 0; fi
            echo "Branch advanced during HEX sync; rebuilding from latest source"
          done
          exit 1
