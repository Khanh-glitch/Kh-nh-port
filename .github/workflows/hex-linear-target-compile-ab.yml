name: HEX linear framebuffer exact shader preflight A/B
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-linear-target-compile-ab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a-b:
    runs-on: macos-15
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default-first
            modes: 'normal,linear-target-compile,normal'
          - label: linear-first
            modes: 'linear-target-compile,normal,linear-target-compile'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real original-shader standalone without reduced visuals
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Confirm exact linear fragment programs are ready before click
        env:
          HEX_GL_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-linear-target.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-webgl-call-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-linear-target-precompile-${{ matrix.label }}
          path: hex-gl-profile/
          if-no-files-found: warn
