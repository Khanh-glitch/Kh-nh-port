name: HEX KHR-ready first-use with guarded release error log A/B
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-first-use-guarded-log-ab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: checked-first
            modes: 'prime-first-use,prime-checked-fast,shadow-linear'
          - label: fast-first
            modes: 'prime-checked-fast,prime-first-use,shadow-linear'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile identical original GLSL PBR shadow 2048 and standalone
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Test first-use initialization one idle frame at a time with explicit LINK_STATUS
        env:
          HEX_GL_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-program-link-status.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-webgl-call-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-true-ready-first-use-program-${{ matrix.label }}
          path: hex-gl-profile/
          if-no-files-found: warn
