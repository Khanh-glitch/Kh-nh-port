name: HEX HIGH fidelity linear-target visual comparison
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-linear-high-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  high:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original full quality PBR and source-matched standalone
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: HIGH quality real scene all nine snapshots and no repeat summon artifact
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-linear-high.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-linear-visual-high.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-linear-full-PBR-HIGH-18-visual-frames
          path: hex-linear-high-frames/
          if-no-files-found: warn
