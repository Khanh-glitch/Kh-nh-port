name: Convert supplied YouTube video for the 3D screen
on:
  push:
    branches: [arena/1e2ad83c-kh-nh-port]
    paths: [.github/workflows/portfolio-youtube-convert.yml]
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          python3 -m pip install --user yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Retrieve supplied video and prepare browser playback
        run: |
          set -euo pipefail
          trap 'python3 -c "import pathlib; p=pathlib.Path(\"youtube.log\"); print(\"::notice title=YouTube retrieval output::\"+p.read_text(errors=\"replace\")[-3000:].replace(\"\\n\",\"%0A\")) if p.exists() else None"' EXIT
          python3 -m yt_dlp --no-playlist -f 'bestvideo[height<=720]+bestaudio/best[height<=720]' --merge-output-format mp4 -o input.%(ext)s 'https://www.youtube.com/watch?v=179btG24VE8' >youtube.log 2>&1
          ffmpeg -nostdin -hide_banner -loglevel error -y -i input.mp4 -vf 'scale=854:480:force_original_aspect_ratio=decrease,pad=854:480:(ow-iw)/2:(oh-ih)/2' -c:v libx264 -preset veryfast -crf 28 -maxrate 650k -bufsize 1300k -c:a aac -b:a 96k -ac 2 -movflags +faststart ngay-mai.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: converted-ngay-mai
          path: ngay-mai.mp4
          retention-days: 2
