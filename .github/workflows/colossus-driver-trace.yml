name: Colossus WebGL driver isolation
on:
  push:
    branches:
      - qa/colossus-webgl-driver-trace
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Profile actual WebGL calls during first laser on fixed preview
        run: node scripts/colossus-webgl-driver-trace.mjs
      - name: Preserve full driver attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colossus-driver-call-evidence
          path: driver-evidence/
          if-no-files-found: warn
