name: HEX Chrome CPU flamegraph first trigger real UEH
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-cpu-first-trigger.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: normal-first
            modes: 'normal,prime-first-use'
          - label: prime-first
            modes: 'prime-first-use,normal'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile exact existing source, PBR and original 2048px shadows
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Record Chrome Profiler CPU stacks, long tasks and source state-machine timings
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-cpu-profiler.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-first-trigger-native-CPU-sampling-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
