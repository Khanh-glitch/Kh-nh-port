name: HEX first-open full-visual CPU and GPU frame-pacing A/B
on:
  push:
    branches: [fix/hex-exact-static-sibling-batching-20261112]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-open:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: original-first
            modes: batch-control,batch-exact,batch-overlap
          - order: overlap-first
            modes: batch-overlap,batch-exact,batch-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install --with-deps chromium
      - name: Reject changed graphics and stale published HEX source
        run: |
          node scripts/sync-hex-exact-batching-standalone.mjs
          node tests/integration-regression.mjs
          node --test tests/hex-exact-batch-contract.mjs
          node scripts/build-pages.mjs
          cmp -s dist-pages/index.html index.html
      - name: First real HEX open, same quality, shader-prepared, reversed order
        env:
          HEX_CPU_BACKEND: software
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-pages >/tmp/hex-open-ab.log 2>&1 &
          for n in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-first-open-original-quality-${{ matrix.order }}
          path: hex-cpu-trace/
          if-no-files-found: warn
