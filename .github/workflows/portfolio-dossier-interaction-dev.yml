name: Portfolio dossier interaction (SwiftShader, evidence-committing)
# Fast, dispatchable loop for the real 3D-click -> dossier acceptance.
# It never rewrites published HTML; it only commits the JSON report so the
# precise defect list is readable from the repository instead of a log blob.
on:
  # GitHub only registers a new workflow file for manual dispatch once it also
  # exists on the default branch, so this loop is reachable from a push to the
  # working branch until the PR lands.
  push:
    branches:
      - feat/portfolio-source-truth-20261112
  workflow_dispatch:
    inputs:
      viewports:
        description: "'fast' = 1280x720 only, 'all' = 390x844 + 1280x720 + 1920x1080"
        default: fast
        required: false
      suite_cap_ms:
        description: Hard per-viewport wall clock budget
        default: '300000'
        required: false
permissions:
  contents: write
jobs:
  dossier-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install compilers and a real GPU browser
        run: |
          npm ci --prefix source
          npm install --prefix source --no-save --package-lock=false playwright@1.56.1
          cd source && npx playwright install --with-deps chromium
      - name: Publish the reviewed standalone
        run: |
          node scripts/sync-space-first-standalone.mjs
          node scripts/sync-portfolio-standalone.mjs
          node scripts/build-pages.mjs
      - name: Real 3D exhibit clicks and dossier interaction
        env:
          PORTFOLIO_VIEWPORTS: ${{ inputs.viewports || 'fast' }}
          PORTFOLIO_SUITE_CAP_MS: ${{ inputs.suite_cap_ms || '300000' }}
        run: |
          set -eu
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/dossier.log 2>&1 &
          for n in {1..90}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          mkdir -p browser-evidence/portfolio
          # set +e is essential: under `set -e` a failing pipeline aborts the
          # step before the status is captured, so the captured output was
          # thrown away and the diagnosis never reached the repository.
          set +e
          set +o pipefail
          node scripts/portfolio-panel-browser-test.mjs > browser-evidence/portfolio/harness-out.txt 2>&1
          STATUS=$?
          cat browser-evidence/portfolio/harness-out.txt
          echo "--- harness exit status: $STATUS ---"
          echo "HARNESS_EXIT=$STATUS" >> browser-evidence/portfolio/harness-out.txt
          exit 0
      - name: Commit the interaction evidence (never HTML) so defects are readable
        if: always()
        run: |
          set -u
          node scripts/portfolio-interaction-evidence.mjs
          cp browser-evidence/portfolio/harness-out.txt /tmp/harness-out.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence
          if git diff --cached --quiet; then
            echo "EVIDENCE_UNCHANGED"
          else
            git commit -m 'evidence(dossier): interaction report [skip ci]'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Fail the run when a real defect was recorded
        if: always()
        run: |
          test -f docs/evidence/portfolio-interaction-latest.md
          cat docs/evidence/portfolio-interaction-latest.md
          if grep -q '^- failures: 0$' docs/evidence/portfolio-interaction-latest.md; then
            echo "DOSSIER_INTERACTION_PASS"
            exit 0
          fi
          echo "DOSSIER_INTERACTION_INCOMPLETE — see docs/evidence above"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dossier-interaction-captures
          path: browser-evidence/portfolio/
          if-no-files-found: warn
