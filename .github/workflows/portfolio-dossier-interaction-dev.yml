name: Portfolio dossier interaction (SwiftShader, evidence-committing)
# Fast, dispatchable loop for the real 3D-click -> dossier acceptance.
# It never rewrites published HTML; it only commits the JSON report so the
# precise defect list is readable from the repository instead of a log blob.
on:
  # GitHub only registers a new workflow file for manual dispatch once it also
  # exists on the default branch, so this loop is reachable from a push to the
  # working branch until the PR lands.
  push:
    branches:
      - feat/portfolio-source-truth-20261112
  workflow_dispatch:
    inputs:
      viewports:
        description: "'fast' = 1280x720 only, 'all' = 390x844 + 1280x720 + 1920x1080"
        default: fast
        required: false
      suite_cap_ms:
        description: Hard per-viewport wall clock budget
        default: '300000'
        required: false
permissions:
  contents: write
jobs:
  dossier-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install compilers and a real GPU browser
        run: |
          npm ci --prefix source
          npm install --prefix source --no-save --package-lock=false playwright@1.56.1
          cd source && npx playwright install --with-deps chromium
      - name: Publish the reviewed standalone
        run: |
          node scripts/sync-space-first-standalone.mjs
          node scripts/sync-portfolio-standalone.mjs
          node scripts/build-pages.mjs
      - name: Real 3D exhibit clicks and dossier interaction
        env:
          PORTFOLIO_VIEWPORTS: ${{ inputs.viewports || 'fast' }}
          PORTFOLIO_SUITE_CAP_MS: ${{ inputs.suite_cap_ms || '300000' }}
        run: |
          set -eu
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/dossier.log 2>&1 &
          for n in {1..90}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/portfolio-panel-browser-test.mjs
      - name: Commit the interaction evidence (never HTML) so defects are readable
        if: always()
        run: |
          set -eu
          if [ ! -f browser-evidence/portfolio/report.json ]; then
            echo "NO_REPORT"; exit 0
          fi
          mkdir -p docs/evidence
          cp browser-evidence/portfolio/report.json docs/evidence/portfolio-interaction-latest.json
          node -e "
            const r = require('./browser-evidence/portfolio/report.json');
            const lines = [];
            lines.push('# Dossier interaction evidence — ' + r.backend);
            lines.push('');
            lines.push('- viewports: ' + r.viewports.join(', '));
            lines.push('- world entries (real visitor input): ' + r.worldEntry.length);
            r.worldEntry.forEach(w => lines.push('  - ' + w.suite + ' · ' + w.exhibit + ' -> ' + w.opened + ' [' + w.via + ']'));
            lines.push('- walk skipped: ' + JSON.stringify(r.suites ? r.suites.flatMap(x => x.walkSkipped || []) : []));
            lines.push('- dossier audits: ' + r.panels.length + '/' + (r.viewports.length * 12));
            lines.push('- independent input paths (E / ESC / scrim / reopen): ' + r.inputPaths.length);
            lines.push('- failures: ' + r.failures.length);
            r.failures.forEach(f => lines.push('  - [' + (f.verdict || '?') + '][' + f.stage + '] ' + f.suite + ': ' + f.error));
            lines.push('- total ms: ' + (r.totalMs ?? 'n/a'));
            require('fs').writeFileSync('docs/evidence/portfolio-interaction-latest.md', lines.join('\n') + '\n');
          "
          cat docs/evidence/portfolio-interaction-latest.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(dossier): interaction report [skip ci]'
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dossier-interaction-captures
          path: browser-evidence/portfolio/
          if-no-files-found: warn
