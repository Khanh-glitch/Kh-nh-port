name: HEX shadow pass cold-first cause A/B
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-shadow-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-first
            modes: 'normal,no-ueh-shadows,normal,no-ueh-instanced-shadows'
          - label: shadows-off-first
            modes: 'no-ueh-shadows,normal,no-ueh-instanced-shadows,normal'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve full-quality original 3D assets and shader physics
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Compare exact original GPU draw with opt-in shadow isolation only
        env:
          HEX_GPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-shadows.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-gpu-isolation.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-gpu-shadows-${{ matrix.label }}
          path: hex-gpu-isolation/
          if-no-files-found: warn
