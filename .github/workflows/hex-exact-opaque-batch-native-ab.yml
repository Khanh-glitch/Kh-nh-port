name: HEX original UEH exact-batch cold-trigger Metal A/B
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-first
            modes: batch-control,batch-exact
          - label: exact-first
            modes: batch-exact,batch-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install chromium
      - name: Verify unchanged original visual modules in actual HTML
        run: |
          node scripts/sync-hex-exact-batching-standalone.mjs
          node tests/integration-regression.mjs
          node --test tests/hex-exact-batch-contract.mjs
          node scripts/build-pages.mjs
      - name: Compare identical original UEH across same native Metal runner, reverse order
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-pages >/tmp/hex-batch-ab.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-exact-opaque-batch-native-metal-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
