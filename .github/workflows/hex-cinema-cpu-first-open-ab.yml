name: HEX first-open original-Cinema CPU-backed sampler A/B
on:
  push:
    branches: [fix/hex-exact-static-sibling-batching-20261112]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-cinema-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: original-first
            modes: batch-control,cinema-cpu-control,cinema-cpu-overlap
          - order: cpu-first
            modes: cinema-cpu-overlap,cinema-cpu-control,batch-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install --with-deps chromium
      - name: Original unchanged cinema, shaders, foliage and published HTML
        run: |
          node scripts/sync-hex-exact-batching-standalone.mjs
          node tests/integration-regression.mjs
          node --test tests/hex-exact-batch-contract.mjs
          node --test tests/hex-cinema-cpu-contract.mjs
          node scripts/build-pages.mjs
          cmp -s index.html dist-pages/index.html
      - name: Compare cinema GPU readback vs same original 1024x450 film on CPU canvas
        env:
          HEX_CPU_BACKEND: software
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory dist-pages >/tmp/hex-cinema-cpu.log 2>&1 &
          for n in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-cinema-original-visual-cpu-gpu-${{ matrix.order }}
          path: hex-cpu-trace/
          if-no-files-found: warn
