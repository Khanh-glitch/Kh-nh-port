name: Colossus Metal fully-ready same-session idle vs click
on:
  push:
    branches: [fix/colossus-frame-budget-prewarm]
    paths:
      - 'scripts/colossus-ready-idle-v-click.mjs'
      - '.github/workflows/colossus-ready-idle-v-click.yml'
      - 'source/src/scene/ApexShowcase.tsx'
      - 'source/src/scene/RagnarokShowcase.tsx'
      - 'source/src/scene/Robot.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
        shadow: [normal]
        exhibit: [normal, noExhibits, noLaser]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install chromium
      - name: Build and synchronize exact source into standalone portfolio
        run: |
          node scripts/sync-colossus-standalone.mjs
          node scripts/build-pages.mjs
      - name: Collect 5-second idle and post-click GPU frames after 131/131 prewarm
        env:
          COLOSSUS_SMOKE_URL: http://127.0.0.1:4173/#at=0,-27,0,20&autostart&skip
          COLOSSUS_SHADOW_VARIANT: ${{ matrix.shadow }}
          COLOSSUS_EXHIBIT_VARIANT: ${{ matrix.exhibit }}
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/colossus-ready-idle.log 2>&1 &
          for n in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/colossus-ready-idle-v-click.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossus-ready-idle-v-click-${{ matrix.exhibit }}-${{ matrix.shadow }}-trial-${{ matrix.trial }}
          path: browser-evidence/
          if-no-files-found: warn
