name: Colossus unattended browser smoke
on:
  push:
    branches:
      - fix/colossus-frame-budget-prewarm
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - name: Install browser controller, use runner Chrome
        run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - name: Synchronize exact checked-out branch source into integrated HTML
        run: |
          node scripts/sync-colossus-standalone.mjs
          node scripts/build-pages.mjs
      - name: Smoke actual candidate on an isolated loopback webserver
        env:
          COLOSSUS_SMOKE_URL: http://127.0.0.1:4173/#at=0,-27,0,20&autostart&skip
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/colossus-site.log 2>&1 &
          for n in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/colossus-browser-smoke.mjs
      - name: Keep screenshots and performance data even when smoke fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colossus-browser-evidence-${{ matrix.trial }}
          path: browser-evidence/
          if-no-files-found: warn
