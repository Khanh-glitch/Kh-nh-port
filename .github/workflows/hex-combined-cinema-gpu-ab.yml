name: HEX combined authentic GPU program first-use and Cinema readback A/B
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-combined-cinema-gpu-ab.yml','scripts/hex-cpu-first-trigger-trace.mjs','scripts/sync-hex-standalone.mjs','source/src/scene/Cinema.tsx','source/src/reality/RealityHost.tsx']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: prime-first
            modes: 'prime-first-use,prime-cinema-far'
          - label: combined-first
            modes: 'prime-cinema-far,prime-first-use'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original full PBR and Cinema 3D with exact standalone modules
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs && node tests/hex-preservation.mjs)
      - name: Measure combined fixes versus GPU first-use alone on real Metal
        env:
          HEX_CPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-combined-cinema-gpu.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cpu-first-trigger-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-combined-program-cinema-${{ matrix.label }}
          path: hex-cpu-trace/
          if-no-files-found: warn
