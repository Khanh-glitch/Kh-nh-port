name: Colossus frame-budgeted prewarm verification
on:
  push:
    branches:
      - fix/colossus-frame-budget-prewarm
  workflow_dispatch:
permissions:
  contents: write
# Do not let older source CI push its embedded HTML after a newer change.
# This is essential because the root HTML is the real Cloudflare artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-integrated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify original integrated HTML baseline
        run: node tests/first-visit-hitch.mjs
      - name: Install editable source dependencies
        run: npm ci --prefix source
      - name: Verify physically lossless scan culling with Three.js
        run: node --experimental-strip-types source/tests/scan-cull.mjs
      - name: Build original Vite source for transpile errors
        run: npm run build --prefix source
      - name: Synchronize fixed Colossus modules into ACTUAL deployed HTML
        run: node scripts/sync-colossus-standalone.mjs
      - name: Verify synchronized standalone JS and frozen render settings
        run: node tests/first-visit-hitch.mjs
      - name: Package the integrated root site for Cloudflare Pages
        run: node scripts/build-pages.mjs
      - name: Upload the integrated site for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: colossus-fixed-integrated-pages
          path: dist-pages/
          if-no-files-found: error
      - name: Commit synchronized HTML into preview branch (never main)
        shell: bash
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "build(colossus): synchronize fixed laser code into preview HTML"
            git push origin HEAD:fix/colossus-frame-budget-prewarm
          else
            echo "Integrated preview HTML is already up to date."
          fi
