name: HEX original-world safe draw-call inventory
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install --with-deps chromium
      - name: Verify original production standalone with unchanged HEX material
        run: |
          node scripts/sync-colossus-idle-standalone.mjs
          node tests/integration-regression.mjs
          node scripts/build-pages.mjs
      - name: Inspect stationary UEH groups without hiding or changing geometry
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/hex-inventory.log 2>&1 &
          for n in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          node scripts/hex-original-static-batch-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-original-static-batch-opportunities
          path: browser-evidence/
          if-no-files-found: warn
