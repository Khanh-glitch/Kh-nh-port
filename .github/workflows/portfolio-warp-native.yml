name: HX-9 warp handoff measurement
on:
  push:
    branches: [arena/1e2ad83c-kh-nh-port]
    paths: ['.github/workflows/portfolio-warp-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix source && npm install --prefix source --no-save --package-lock=false playwright@1.56.1 && (cd source && npx playwright install chromium)
      - run: node scripts/build-pages.mjs
      - name: Measure real warp handoff
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist-pages >/tmp/hx9-server.log 2>&1 &
          node scripts/hx9-warp-browser-test.mjs
      - name: Report measurements
        if: always()
        run: |
          if test -f hx9-warp-evidence/result.json; then
            python3 -c "import json; print('::notice title=HX9 warp::'+json.dumps(json.load(open('hx9-warp-evidence/result.json')),separators=(',',':')))"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hx9-warp-native
          path: hx9-warp-evidence/
          if-no-files-found: warn
