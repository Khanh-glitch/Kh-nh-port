name: Colossus materialize early-discard pixel parity
on:
  push:
    branches: [fix/colossus-frame-budget-prewarm]
    paths:
      - 'source/src/scene/materialize.ts'
      - 'source/tests/materialize-parity-fixture.html'
      - 'scripts/colossus-materialize-parity.mjs'
      - '.github/workflows/colossus-materialize-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-parity:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci --prefix source
      - run: npm install --prefix source --no-save --package-lock=false playwright@1.56.1
      - run: cd source && npx playwright install chromium
      - name: Serve real source materialize module through Vite
        run: |
          (cd source && npx vite --host 127.0.0.1 --port 5173 >/tmp/colossus-mat-fixture.log 2>&1) &
          for n in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/tests/materialize-parity-fixture.html; then break; fi
            sleep 1
          done
      - name: Check early-discard against exact legacy pixels across six scan stages
        run: node scripts/colossus-materialize-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colossus-materialize-six-stage-pixel-parity
          path: browser-evidence/
          if-no-files-found: warn
