name: Import web-ready original lyric video
on:
  push:
    branches: [arena/1e2ad83c-kh-nh-port]
    paths: ['.github/workflows/portfolio-ngay-mai-import.yml']
permissions:
  contents: write
  actions: read
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/1e2ad83c-kh-nh-port
      - uses: actions/download-artifact@v4
        with:
          name: ngay-mai-original-check
          path: downloaded-lyric
          github-token: ${{ github.token }}
          run-id: 43470324589
      - name: Verify and import the owner's original video
        run: |
          set -euxo pipefail
          test -s downloaded-lyric/ngay-mai.mp4
          cp downloaded-lyric/ngay-mai.mp4 source/public/portfolio/films/ngay-mai.mp4
          git config user.name 'Portfolio Media Import'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/public/portfolio/films/ngay-mai.mp4
          git commit -m 'Add web-ready original lyric video'
          git push origin HEAD:arena/1e2ad83c-kh-nh-port
