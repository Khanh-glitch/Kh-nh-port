name: HEX link newly-created shader variants trace
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-shader-variant-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  variant-trace:
    runs-on: macos-15
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: full-first
            modes: 'normal,no-ueh-instanced,normal'
          - label: instanced-off-first
            modes: 'no-ueh-instanced,normal,no-ueh-instanced'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact HEX standalone with original shaders
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Map first-click GL program signatures to PBR, instancing and materialization
        env:
          HEX_GL_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-gl-signatures.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-webgl-call-profile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-exact-first-click-program-sigs-${{ matrix.label }}
          path: hex-gl-profile/
          if-no-files-found: warn
