name: HEX UEH instanced PBR versus original buffers first draw
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-instanced-pbr-ab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    runs-on: macos-15
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: standard-first
            modes: 'normal,basic-instances,no-ueh-instanced,normal'
          - label: basic-first
            modes: 'basic-instances,normal,no-ueh-instanced,normal'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build original source and output untouched-quality HTML
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Find actual GPU bottleneck by isolating PBR vs original instance attributes
        env:
          HEX_GPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-pbr-diagnostic.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-gpu-isolation.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-pbr-original-attributes-${{ matrix.label }}
          path: hex-gpu-isolation/
          if-no-files-found: warn
