name: HEX cooperative Linear FULL HIGH visual parity
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-cooperative-linear-high-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: macos-15
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep all original high-quality scene, shaders, shadows and assets
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Compare real HIGH view at 9 materialization stages with no animation loss
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-coop-high-visual.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-cooperative-high-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-cooperative-linear-FULL-HIGH-18-frames
          path: hex-cooperative-high-frames/
          if-no-files-found: warn
