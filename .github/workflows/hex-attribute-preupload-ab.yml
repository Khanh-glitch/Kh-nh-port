name: HEX original GPU attributes 1-triangle preupload A/B
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default-first
            modes: 'normal,attr-warm,normal,attr-warm'
          - label: attribute-first
            modes: 'attr-warm,normal,attr-warm,normal'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build real unchanged-quality standalone and full source
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Test GPU buffer residency vs first-click hitch in reverse orders
        env:
          HEX_GPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-attr-preupload.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-gpu-isolation.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-one-triangle-attribute-preupload-${{ matrix.label }}
          path: hex-gpu-isolation/
          if-no-files-found: warn
