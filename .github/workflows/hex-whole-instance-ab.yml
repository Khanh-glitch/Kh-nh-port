name: HEX whole-instance safe front gate A/B
on:
  push:
    branches: [fix/hex-hitch-no-visual-loss]
    paths: ['.github/workflows/hex-whole-instance-ab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original-first
            modes: 'normal,whole-gate,normal,whole-gate'
          - label: gate-first
            modes: 'whole-gate,normal,whole-gate,normal'
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile real original shader and source scene
        run: |
          npm ci --prefix candidate/source
          npm install --prefix candidate/source --no-save --package-lock=false playwright@1.56.1
          (cd candidate/source && npx playwright install chromium)
          (cd candidate && npm run build --prefix source && node scripts/sync-hex-standalone.mjs && node scripts/build-pages.mjs)
          (cd candidate && node tests/hex-preservation.mjs)
      - name: Run first-click counterbalanced GPU measurements, no visual assets removed
        env:
          HEX_GPU_MODES: ${{ matrix.modes }}
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 --directory candidate/dist-pages >/tmp/hex-gate.log 2>&1 &
          for n in {1..80}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/; then break; fi
            sleep 1
          done
          node candidate/scripts/hex-gpu-isolation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hex-whole-gate-${{ matrix.label }}
          path: hex-gpu-isolation/
          if-no-files-found: warn
