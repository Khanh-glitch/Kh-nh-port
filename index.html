:root{--font-sans:'Inter','Inter',system-ui,sans-serif;--font-display:'Space Grotesk','Inter',system-ui,sans-serif;}

html,
body,
#root {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

canvas {
  display: block;
  touch-action: none;
  outline: none;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateX(40px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}

::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.2);
  border-radius: 6px;
}

#orbita-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:90;gap:16px;background:radial-gradient(ellipse at 50% 65%,#1c1334,#020108 58%);color:#f0ebff;font:500 13px 'Inter',sans-serif;letter-spacing:.06em;text-align:center;padding:24px;transition:opacity .6s,visibility .6s}
#orbita-loading.done{visibility:hidden;opacity:0;pointer-events:none}
#orbita-loading b{font-family:'Space Grotesk',sans-serif;font-size:clamp(32px,6vw,64px);letter-spacing:-.06em;background:linear-gradient(90deg,#80edff,#d2b7ff,#ff90d2);background-clip:text;color:transparent}
#orbita-loading .orbit{height:40px;width:40px;border:1px solid #a48aed44;border-top:2px solid #a48aed;border-radius:50%;animation:orbita-spin 1.2s linear infinite}
#orbita-loading small{max-width:650px;color:#aaa3c0;font-size:12px;line-height:1.7;letter-spacing:0}
#orbita-loading .errorbox{display:none;max-width:650px;width:min(94vw,650px);background:rgba(25,19,47,.7);border:1px solid #9174c344;border-radius:12px;padding:16px;letter-spacing:0}
#orbita-loading.is-error .errorbox{display:block}
#orbita-loading .technical{font:11px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#c4b8dc;max-height:125px;overflow:auto;word-break:break-word;white-space:pre-wrap;text-align:left;margin:12px 0 0}
#orbita-loading .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:14px}
#orbita-loading button{border:1px solid #a285ceaa;background:rgba(110,75,171,.28);padding:10px 16px;color:#fff;border-radius:8px;cursor:pointer;font:600 12px 'Inter',sans-serif}
#orbita-loading button:hover{background:rgba(142,105,220,.44)}
@keyframes orbita-spin{to{transform:rotate(360deg)}}

</head><body>
<div id="root"></div>
<div id="orbita-loading" aria-live="polite"><div class="orbit"></div><b>ORBITA</b><span id="orbita-status">Đang chuẩn bị bộ nạp 3D...</span><small id="orbita-detail">Giữ nguyên các vật thể, ánh sáng, Bloom và shader trong bản gốc.</small>
  <div class="errorbox" id="orbita-errbox"><div>Chi tiết khởi động:</div><pre id="orbita-error" class="technical"></pre><div class="actions"><button id="orbita-retry" type="button">Thử nguồn thư viện khác</button><button id="orbita-copy" type="button">Sao chép lỗi</button></div></div>
</div>
<script>
(function () {
  'use strict';
  const status = document.getElementById('orbita-status');
  const detail = document.getElementById('orbita-detail');
  const loading = document.getElementById('orbita-loading');
  const errorText = document.getElementById('orbita-error');
  const sources = [{"name":"ESM main","prefix":"https://esm.sh"},{"name":"ESM mirror","prefix":"https://cdn.esm.sh"},{"name":"jsDelivr ESM","prefix":"https://esm.run"}];
  const moduleMap = JSON.parse(document.getElementById('orbita-embedded-map').textContent);
  let chosen = 0;
  let bootFinished = false;
  let failureMessage = '';
  // A stalled CDN request may not trigger an error; report it rather than spin forever.
  const loadWatchdog = setTimeout(function () {
    if (!bootFinished) fail(new Error('Quá 45 giây nhưng thư viện 3D chưa khởi động. Có thể CDN bị chặn hoặc tải quá chậm. Hãy bấm thử nguồn dự phòng, hoặc mở Console (F12) để xem request bị lỗi.'));
  }, 45000);
  const buildImportMap = function (base) {
    const m = Object.assign({}, moduleMap);
    const u = (s) => base + '/' + s;
    const x = '?external=react,react-dom,three,@react-three/fiber,postprocessing&target=es2022';
    m.react = u('react@19.2.6?target=es2022');
    m['react/jsx-runtime'] = u('react@19.2.6/jsx-runtime?target=es2022');
    m['react-dom'] = u('react-dom@19.2.6?external=react&target=es2022');
    m['react-dom/client'] = u('react-dom@19.2.6/client?external=react&target=es2022');
    m.three = u('three@0.187.0?target=es2022');
    m['three/'] = u('three@0.187.0/');
    m['three/examples/jsm/utils/BufferGeometryUtils.js'] = u('three@0.187.0/examples/jsm/utils/BufferGeometryUtils.js?external=three&target=es2022');
    m['three/examples/jsm/geometries/RoundedBoxGeometry.js'] = u('three@0.187.0/examples/jsm/geometries/RoundedBoxGeometry.js?external=three&target=es2022');
    m['@react-three/fiber'] = u('@react-three/fiber@9.8.2?external=react,react-dom,three&target=es2022');
    m['@react-three/drei'] = u('@react-three/drei@10.7.9' + x);
    m['@react-three/postprocessing'] = u('@react-three/postprocessing@3.2.2' + x);
    m.postprocessing = u('postprocessing@6.39.6?external=three&target=es2022');
    m.zustand = u('zustand@5.1.0?external=react&target=es2022');
    m.clsx = u('clsx@2.1.1?target=es2022');
    m['tailwind-merge'] = u('tailwind-merge@3.4.0?target=es2022');
    return { imports: m };
  };
  // A previous first-file bug labeled ANY resource error (even Tailwind CSS)
  // as "3D library failed".  Only actual module import or render failures count.
  function fail(err) {
    if (bootFinished || loading.classList.contains('is-error')) return;
    const raw = (err && (err.stack || err.message)) || String(err);
    // A data: URL stack can be hundreds of thousands of characters long.
    // Resolve embedded scripts back to human-readable original source module names.
    let str = String(raw);
    for (const key of Object.keys(moduleMap)) {
      if (str.includes(moduleMap[key])) str = str.split(moduleMap[key]).join('[' + key + ']');
    }
    str = str.replace(/data:text\/javascript;base64,[A-Za-z0-9+/=]+/g, '[embedded JavaScript]');
    failureMessage = str.slice(0, 8000);
    console.error('[ORBITA] 3D boot error:', err);
    clearTimeout(loadWatchdog);
    loading.classList.add('is-error');
    loading.querySelector('.orbit').style.display = 'none';
    status.textContent = 'Không thể khởi động 3D';
    detail.textContent = 'Đây là lỗi nạp module hoặc chạy ứng dụng, không phải lỗi ánh sáng. Nguồn hiện tại: ' + sources[chosen].name;
    errorText.textContent = failureMessage;
    document.getElementById('orbita-retry').textContent = chosen < sources.length - 1 ? 'Thử nguồn thư viện dự phòng' : 'Thử lại từ nguồn đầu';
  }
  document.getElementById('orbita-retry').addEventListener('click', function () {
    const url = new URL(location.href);
    url.searchParams.set('orbita_source', String((chosen + 1) % sources.length));
    location.replace(url.href);
  });
  document.getElementById('orbita-copy').addEventListener('click', function () {
    const msg = '[ORBITA / '+sources[chosen].name+'] '+failureMessage;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).catch(() => prompt('Sao chép lỗi:', msg));
    else prompt('Sao chép lỗi:', msg);
  });
  const qp = new URLSearchParams(location.search);
  const requested = Number(qp.get('orbita_source'));
  chosen = Number.isInteger(requested) && requested >= 0 && requested < sources.length ? requested : 0;
  status.textContent = 'Đang kết nối thư viện 3D (' + sources[chosen].name + ')...';
  const importMap = document.createElement('script');
  importMap.type = 'importmap';
  importMap.textContent = JSON.stringify(buildImportMap(sources[chosen].prefix));
  document.head.appendChild(importMap);
  window.__orbitaFailed = fail;
  window.__orbitaReady = function () {
    if (loading.classList.contains('is-error')) return;
    bootFinished = true;
    clearTimeout(loadWatchdog);
    loading.classList.add('done');
    setTimeout(() => loading.remove(), 800);
  };
  // React's createRoot(...).render() is asynchronous: do not consider the module
  // imported successfully until a canvas is mounted by the actual application.
  window.__orbitaImported = function () {
    status.textContent = 'Đang tạo Canvas và khởi tạo scene 3D...';
    detail.textContent = 'Đã tải mã ứng dụng, đang chuẩn bị cảnh 3D.';
    const start = performance.now();
    const timer = setInterval(function () {
      if (document.querySelector('#root canvas')) {
        clearInterval(timer);
        requestAnimationFrame(() => requestAnimationFrame(window.__orbitaReady));
      } else if (performance.now() - start > 16000) {
        clearInterval(timer);
        fail(new Error('Đã tải JS nhưng Canvas 3D không được tạo trong 16 giây. Có thể React gặp lỗi khi render.'));
      }
    }, 120);
  };
  window.addEventListener('error', function (event) {
    // Ignore optional external scripts/styles: these were falsely generating
    // this exact error screen in the previous release.
    if (event.target && event.target !== window) return;
    if (!document.querySelector('#root canvas') && event.error && !bootFinished) fail(event.error);
  });
  window.addEventListener('unhandledrejection', function (event) {
    if (!document.querySelector('#root canvas') && !bootFinished) fail(event.reason);
  });
  const boot = document.createElement('script');
  boot.type = 'module';
  boot.textContent = 'import("orbita/main").then(() => window.__orbitaImported()).catch((error) => window.__orbitaFailed(error));';
  document.body.appendChild(boot);
})();
</script>
